[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "libxkbcommon",
  "mesa",
  "pango",
  "cairo",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "glib",
  "gtk3",
  "alsa-lib"
]

[phases.build]
cmds = [
  "npm --prefix frontend install",
  "npm --prefix frontend run build",
  "mkdir -p backend/public",
  "cp -r frontend/dist/* backend/public/",
  "npm --prefix backend install",
  "npm --prefix backend run build"
]

[start]
cmd = "cd backend && npm start"